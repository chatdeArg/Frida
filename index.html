<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Frida — Asistente de Voz</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Segoe UI', system-ui, sans-serif;
    background:#0a0e1a; color:#e8f0ff; min-height:100vh;
    display:flex; flex-direction:column;
    background-image:radial-gradient(circle at 50% 30%, #16213e 0%, #0a0e1a 70%);
  }
  header { padding:16px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:1.1rem; letter-spacing:3px; color:#6ec6ff; font-weight:600; }
  header button { background:none; border:1px solid #2a3a5f; color:#9fb8d8; border-radius:10px; padding:6px 12px; font-size:1rem; cursor:pointer; }
  #reactor { width:150px; height:150px; margin:12px auto; position:relative; }
  #reactor .core {
    position:absolute; inset:35px; border-radius:50%;
    background:radial-gradient(circle,#bfe9ff 0%,#38b6ff 45%,#0a5ea8 100%);
    box-shadow:0 0 40px #38b6ff, 0 0 80px rgba(56,182,255,.4);
    animation:pulse 3s ease-in-out infinite;
    transition:box-shadow .3s;
  }
  #reactor.listening .core { box-shadow:0 0 60px #4dffdb, 0 0 120px rgba(77,255,219,.5); animation:pulse 1s ease-in-out infinite; }
  #reactor .ring { position:absolute; inset:12px; border-radius:50%; border:2px solid rgba(56,182,255,.35); animation:spin 12s linear infinite; }
  #reactor .ring::before { content:''; position:absolute; top:-4px; left:50%; width:8px; height:8px; background:#6ec6ff; border-radius:50%; box-shadow:0 0 10px #6ec6ff; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  #chat { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:16px; line-height:1.45; font-size:.95rem; animation:fade .3s; }
  @keyframes fade { from{opacity:0; transform:translateY(8px)} to{opacity:1} }
  .msg.user { align-self:flex-end; background:#1d3a6b; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:#14213d; border:1px solid #22355c; border-bottom-left-radius:4px; }
  #controls { padding:14px 16px calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  #textInput {
    flex:1; background:#111a30; border:1px solid #2a3a5f; border-radius:24px;
    padding:12px 18px; color:#e8f0ff; font-size:1rem; outline:none;
  }
  #micBtn {
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(145deg,#38b6ff,#0a5ea8); font-size:1.4rem;
    box-shadow:0 0 18px rgba(56,182,255,.5); transition:transform .15s;
  }
  #micBtn:active { transform:scale(.9); }
  #fileBtn {
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(145deg,#2a3a5f,#16213e); font-size:1.3rem;
    border:1px solid #2a3a5f; transition:transform .15s;
  }
  #fileBtn:active { transform:scale(.9); }
  #status { text-align:center; font-size:.78rem; color:#5f7ba6; padding:0 16px 6px; min-height:1.2em; }
  #modal { display:none; position:fixed; inset:0; background:rgba(4,8,18,.85); z-index:10; padding:24px; overflow-y:auto; }
  #modal.open { display:block; }
  #modal .card { background:#111a30; border:1px solid #2a3a5f; border-radius:16px; padding:20px; max-width:480px; margin:20px auto; }
  #modal h2 { color:#6ec6ff; font-size:1.05rem; margin-bottom:12px; }
  #modal label { display:block; font-size:.85rem; color:#9fb8d8; margin:12px 0 4px; }
  #modal select { width:100%; background:#0a0e1a; border:1px solid #2a3a5f; border-radius:10px; padding:10px 12px; color:#e8f0ff; font-size:.9rem; }
  #modal textarea { width:100%; background:#0a0e1a; border:1px solid #2a3a5f; border-radius:10px; padding:10px 12px; color:#e8f0ff; font-size:.9rem; font-family:inherit; resize:vertical; }
  #modal input { width:100%; background:#0a0e1a; border:1px solid #2a3a5f; border-radius:10px; padding:10px 12px; color:#e8f0ff; font-size:.9rem; }
  #modal p { font-size:.8rem; color:#5f7ba6; margin-top:4px; line-height:1.4; }
  #modal .save { margin-top:18px; width:100%; padding:12px; border:none; border-radius:12px; background:#38b6ff; color:#04203a; font-weight:700; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>◉ FRIDA</h1>
  <button id="installBtn" style="display:none" onclick="installApp()">📲 Instalar</button>
  <button onclick="document.getElementById('modal').classList.add('open')">⚙️ Config</button>
</header>

<div id="reactor"><div class="ring"></div><div class="core"></div></div>
<div id="status">Tocá el micrófono y hablame</div>
<div id="chat"></div>

<div id="controls">
  <button id="fileBtn" title="Foto o archivo">📎</button>
  <input id="fileInput" type="file" accept="image/*,application/pdf" style="display:none">
  <input id="textInput" type="text" placeholder="Escribí o hablá..." autocomplete="off">
  <button id="micBtn" title="Hablar">🎙️</button>
</div>

<div id="modal">
  <div class="card">
    <h2>Configuración de IA</h2>
    <label>Proveedor de IA</label>
    <select id="cfgProvider" onchange="updateModels()">
      <option value="groq">Groq — gratis, súper rápido</option>
      <option value="gemini">Google Gemini — gratis</option>
      <option value="openrouter">OpenRouter — modelos gratis</option>
      <option value="custom">Otro (compatible con OpenAI)</option>
    </select>
    <label>Clave de API</label>
    <input id="cfgKey" type="password" placeholder="Pegá tu clave acá">
    <p id="helpKey"></p>
    <label>Modelo</label>
    <select id="cfgModel"></select>
    <div id="urlWrap" style="display:none">
      <label>URL base (solo para "Otro")</label>
      <input id="cfgUrl" type="text" placeholder="https://api.ejemplo.com/v1">
    </div>
    <label>Personalidad / instrucciones (opcional)</label>
    <textarea id="cfgPersona" rows="3" placeholder="Ej: Sos divertida y usá emojis. Llamá jefe al usuario."></textarea>
    <p>Esto le cambia el carácter a Frida en todas sus respuestas.</p>
    <p>Sin clave, uso mi base de conocimiento local: clima, tránsito, matemáticas y temas de colegio.</p>
    <label>Clave de TomTom (opcional, para tránsito)</label>
    <input id="cfgTomTom" type="password" placeholder="Gratis en developer.tomtom.com">
    <button class="save" onclick="saveConfig()">Guardar</button>
  </div>
</div>

<script>
// ============ ESTADO ============
const PROVIDERS = {
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',
    help: 'Gratis en console.groq.com → API Keys',
    models: ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant']
  },
  gemini: {
    url: null,
    help: 'Gratis en aistudio.google.com → Get API Key',
    models: ['gemini-2.5-flash', 'gemini-2.0-flash']
  },
  openrouter: {
    url: 'https://openrouter.ai/api/v1/chat/completions',
    help: 'Gratis en openrouter.ai/keys — elegí modelos con :free',
    models: ['meta-llama/llama-3.3-70b-instruct:free', 'deepseek/deepseek-r1:free', 'google/gemma-3-27b-it:free']
  },
  custom: {
    url: '',
    help: 'Cualquier API compatible con OpenAI (DeepSeek, Mistral, Ollama...)',
    models: []
  }
};
const cfg = {
  provider: localStorage.getItem('frida_provider') || 'groq',
  llmKey: localStorage.getItem('frida_key') || '',
  model: localStorage.getItem('frida_model') || '',
         url: localStorage.getItem('frida_url') || '',
  tomtom: localStorage.getItem('frida_tomtom') || '',
  persona: localStorage.getItem('frida_persona') || '',
  memory: JSON.parse(localStorage.getItem('frida_memory') || '[]'),
};
function buildSystemPrompt(){
  let p = SYSTEM_PROMPT;
  if(cfg.persona) p += '\n\nPersonalidad e instrucciones del usuario: ' + cfg.persona;
  if(cfg.memory.length) p += '\n\nCosas que el usuario te pidió recordar: ' + cfg.memory.join('. ');
  return p;
}
document.getElementById('cfgProvider').value = cfg.provider;
document.getElementById('cfgKey').value = cfg.llmKey;
document.getElementById('cfgTomTom').value = cfg.tomtom;
document.getElementById('cfgUrl').value = cfg.url;
document.getElementById('cfgPersona').value = cfg.persona;

function updateModels(){
  const prov = document.getElementById('cfgProvider').value;
  const sel = document.getElementById('cfgModel');
  sel.innerHTML = '';
  PROVIDERS[prov].models.forEach(m=>{
    const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o);
  });
  if(cfg.model && PROVIDERS[prov].models.includes(cfg.model)) sel.value = cfg.model;
  document.getElementById('helpKey').textContent = PROVIDERS[prov].help;
  document.getElementById('urlWrap').style.display = prov === 'custom' ? 'block' : 'none';
}
updateModels();

function saveConfig(){
  cfg.provider = document.getElementById('cfgProvider').value;
  cfg.llmKey = document.getElementById('cfgKey').value.trim();
  cfg.model = document.getElementById('cfgModel').value;
  cfg.url = document.getElementById('cfgUrl').value.trim();
  cfg.tomtom = document.getElementById('cfgTomTom').value.trim();
  cfg.persona = document.getElementById('cfgPersona').value.trim();
  localStorage.setItem('frida_provider', cfg.provider);
  localStorage.setItem('frida_key', cfg.llmKey);
  localStorage.setItem('frida_model', cfg.model);
  localStorage.setItem('frida_url', cfg.url);
  localStorage.setItem('frida_tomtom', cfg.tomtom);
  localStorage.setItem('frida_persona', cfg.persona);
  document.getElementById('modal').classList.remove('open');
  addMsg('bot','Listo, configuración guardada.');
}

// ============ VOZ: SÍNTESIS ============
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es'));
  voice = vs.find(v=>/google/i.test(v.name)) || vs[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-419'; if(voice) u.voice = voice;
  u.rate = 1.05; speechSynthesis.speak(u);
}

// ============ VOZ: RECONOCIMIENTO ============
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR){
  rec = new SR();
  rec.lang = 'es-419'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { handle(e.results[0][0].transcript); };
  rec.onend = () => { setListening(false); };
  rec.onerror = e => { setListening(false); status(e.error==='not-allowed'?'Permiso de micrófono denegado':'Error de micrófono'); };
}
const micBtn = document.getElementById('micBtn'), reactor = document.getElementById('reactor'), statusEl = document.getElementById('status');
function status(t){ statusEl.textContent = t; }
function setListening(on){
  listening = on;
  reactor.classList.toggle('listening', on);
  micBtn.textContent = on ? '⏹️' : '🎙️';
  status(on ? 'Escuchando...' : 'Tocá el micrófono y hablame');
}
micBtn.onclick = () => {
  if(!rec){ status('Tu navegador no soporta reconocimiento de voz. Usá Chrome.'); return; }
  if(listening){ rec.stop(); return; }
  speechSynthesis.cancel(); rec.start(); setListening(true);
};

// ============ CHAT UI ============
const chat = document.getElementById('chat');
function addMsg(who, text){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  if(who==='bot') speak(text);
}
document.getElementById('textInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.value.trim()){ handle(e.target.value.trim()); e.target.value=''; }
});

// ============ ARCHIVOS: CÁMARA / IMÁGENES / PDF ============
const fileBtn = document.getElementById('fileBtn'), fileInput = document.getElementById('fileInput');
let lastImage = null;

// ============ INSTALACIÓN PWA ============
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});
async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  } else {
    addMsg('bot','Si no ves el aviso, usá el menú de Chrome: Agregar a pantalla de inicio.');
  }
}
fileBtn.onclick = () => fileInput.click();
fileInput.onchange = async e => {
  const file = e.target.files[0];
  fileInput.value = '';
  if(!file) return;
  if(file.type.startsWith('image/')) return processImage(file);
  if(file.type === 'application/pdf') return processPDF(file);
  addMsg('bot','Solo puedo procesar imágenes y archivos PDF.');
};

function showFilePreview(file, url){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.style.padding = '8px';
  if(url && file.type.startsWith('image/')){
    const img = document.createElement('img');
    img.src = url; img.style.cssText = 'max-width:100%; border-radius:12px; display:block;';
    div.appendChild(img);
  }
  const cap = document.createElement('div');
  cap.textContent = '📎 ' + file.name;
  cap.style.cssText = 'font-size:.8rem; margin-top:6px; opacity:.8;';
  div.appendChild(cap);
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}

async function processImage(file){
  status('Procesando imagen...');
  const dataUrl = await new Promise(res=>{ const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  showFilePreview(file, dataUrl);
  lastImage = {dataUrl: dataUrl, type: file.type};
  if(cfg.provider === 'gemini' && cfg.llmKey){
    try{
      const base64 = dataUrl.split(',')[1];
      const model = cfg.model || PROVIDERS.gemini.models[0];
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.llmKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{parts:[
          {text: buildSystemPrompt() + '\n\nEl usuario te envió una imagen. Describila brevemente en español, como contándosela a alguien en voz alta.'},
          {inline_data:{mime_type:file.type, data:base64}}
        ]}]})
      });
      const d = await r.json();
      if(d.error) return addMsg('bot','Error de Gemini: ' + d.error.message);
      status('Tocá el micrófono y hablame');
      return addMsg('bot', d.candidates[0].content.parts[0].text.trim());
    }catch(err){ return addMsg('bot','Error al analizar la imagen. Revisá tu conexión.'); }
  }
  addMsg('bot','Recibí tu imagen. Para analizarla y contarte qué contiene, configurá una clave de Gemini gratis en ⚙️ Config.');
}

async function processPDF(file){
  status('Leyendo PDF...');
  if(typeof pdfjsLib === 'undefined'){
    return addMsg('bot','No pude cargar el lector de PDF. Revisá tu conexión a internet e intentá de nuevo.');
  }
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let text = '';
    for(let i=1; i<=Math.min(pdf.numPages, 10); i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n';
    }
    text = text.trim();
    showFilePreview(file, null);
    if(!text) return addMsg('bot','Este PDF parece tener solo imágenes escaneadas, sin texto seleccionable. Probá enviando una foto de las páginas con el botón 📎.');
    if(cfg.llmKey){
      status('Resumiendo PDF...');
      return askLLM('Te paso el texto de un PDF llamado "' + file.name + '". Haceme un resumen corto en español, máximo 5 oraciones, como contándomelo en voz alta. Después contame en una oración de qué trata en general.\n\n' + text.slice(0, 12000));
    }
    addMsg('bot', 'Leí tu PDF: "' + file.name + '" (' + pdf.numPages + ' páginas). Acá va un fragmento:\n\n' + text.slice(0,600) + (text.length>600?'\n\n[...]':''));
  }catch(err){ addMsg('bot','No pude leer ese PDF. Probá con otro archivo.'); }
 }
 // ============ MOTOR DE RESPUESTAS ============
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

const BASE = {
  'fotosintesis': 'La fotosíntesis es el proceso por el cual las plantas convierten luz solar, agua y dióxido de carbono en glucosa y oxígeno. Ocurre en los cloroplastos, gracias a la clorofila. La ecuación es: 6 CO2 más 6 H2O, con luz, producen C6 H12 O6 más 6 O2.',
  'pitagoras': 'El teorema de Pitágoras dice que en un triángulo rectángulo, el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos: a cuadrado más b cuadrado, igual a c cuadrado. Por ejemplo, si los catetos son 3 y 4, la hipotenusa es 5.',
  'celula': 'La célula es la unidad básica de la vida. Tiene membrana, citoplasma y material genético. Las animales tienen núcleo definido, son eucariotas; las bacterias no, son procariotas.',
  'sistema solar': 'El sistema solar tiene 8 planetas: Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano y Neptuno. El sol contiene el 99.8 por ciento de toda la masa del sistema.',
  'segunda guerra mundial': 'Fue de 1939 a 1945. Empezó con la invasión de Polonia por Alemania. Terminó en Europa en mayo de 1945 y en el Pacífico en agosto con las bombas atómicas en Japón.',
  'ciclo del agua': 'Es el recorrido del agua: evapora del mar, se condensa formando nubes, precipita como lluvia o nieve, y vuelve a ríos y mares. Se repite constantemente.',
  'capas de la tierra': 'La Tierra tiene corteza, manto y núcleo. El núcleo externo es líquido y el interno sólido, de hierro y níquel. La corteza es donde vivimos.',
  'mitocondria': 'La mitocondria es la encargada de producir energía en la célula: convierte nutrientes en ATP. Por eso se la llama la central energética de la célula.',
  'que hora es': null, 'hora': null,
};

async function handle(raw){
  const text = raw.trim();
  if(!text) return;
  addMsg('user', text);
  const q = norm(text);

  // Nombre
  if(/(como te llamas|tu nombre|quien sos)/.test(q))
    return addMsg('bot','Me llamo Frida, tu asistente personal.');

  // Saludos
  if(/^(hola|buenas|hey|buenos dias|buenas tardes|buenas noches)/.test(q))
    return addMsg('bot','Hola. Soy Frida. Preguntame sobre tareas del colegio, el clima, tránsito, pedime cuentas de matemática, o decime \'dibujá\' algo.');

  // Hora
  if(BASE[q] === null || /\bque hora\b/.test(q))
    return addMsg('bot','Son las ' + new Date().toLocaleTimeString('es-419',{hour:'numeric',minute:'2-digit'}) + '.');

  // Mate: "cuánto es 12*8+4" o "calcula ..."
  const calcMatch = q.match(/([\d][\d\s\+\-\*\/\(\)\.,]*[\d]|\d)/);
  if(/(cuanto es|cuánto es|calcula|cuanto da|suma|resta|multiplica|divide)/.test(q) && calcMatch){
    const expr = calcMatch[1].replace(',', '.').replace(/[^\d\+\-\*\/\(\)\. ]/g,'').trim();
    if(/^[\d\+\-\*\/\(\)\. ]+$/.test(expr) && /\d/.test(expr)){
      try {
        const r = Function('"use strict"; return (' + expr + ')')();
        return addMsg('bot', expr + ' es igual a ' + (Math.round(r*10000)/10000) + '.');
      } catch(e){}
    }
  }

  // Clima (open-meteo, gratis, sin clave)
  if(/\b(clima|tiempo|temperatura|lluvia|weather)\b/.test(q)) return weather();

  // Tránsito
  if(/\b(transito|trafico|tráfico|accidente|camino|ruta)\b/.test(q)) return traffic();

  // Chiste
  if(/chiste|broma/.test(q)){
    const chistes = ['¿Por qué el libro de matemáticas está triste? Porque tiene demasiados problemas.',
      '¿Qué le dice un jardinero a otro? Nos vemos cuando podamos.',
      '¿Por qué no pelea un libro? Porque prefiere evitar los conflictos.'];
    return addMsg('bot', chistes[Math.floor(Math.random()*chistes.length)]);
  }

  // Base de conocimiento local
  for(const k in BASE){
    if(BASE[k] && q.includes(k)) return addMsg('bot', BASE[k]);
  }
  if(/gracias/.test(q)) return addMsg('bot','De nada. Estoy para ayudarte.');

  // Imágenes: "dibujá X", "crea una imagen de X", "genera una foto de X"
  const imgMatch = q.match(/(?:dibuja|dibuja me|crea|genera|hace|haz|mostra|mostrame)\s+(?:una\s+)?(?:imagen|foto|dibujo|ilustracion)\s+(?:de\s+)?(.+)/) || q.match(/^imagen de (.+)/);
  if(imgMatch && imgMatch[1] && imgMatch[1].trim().length > 2){
    return drawImage(imgMatch[1].trim());
  }

  // Editar última imagen: "editá la imagen: ponele un fondo rojo"
  const editMatch = q.match(/(?:edita|editala|modifica|transforma|cambia)\b[^:]*:?\s*(.+)/);
  if(editMatch && editMatch[1] && editMatch[1].trim().length > 2 && /(imagen|foto|edit|transform)/.test(q)){
    if(lastImage) return editImage(editMatch[1].trim());
    return addMsg('bot','No tengo ninguna imagen para editar. Primero mandame una foto con el botón 📎.');
  }

  // Memoria: "recordá que..."
  const recMatch = q.match(/(?:recorda|acordate|acuerdate|guarda|anota|aprende)\s+(?:que\s+)?(.+)/);
  if(recMatch && recMatch[1] && recMatch[1].trim().length > 2){
    cfg.memory.push(recMatch[1].trim());
    localStorage.setItem('frida_memory', JSON.stringify(cfg.memory));
    return addMsg('bot','Listo, lo guardé en mi memoria. Te lo voy a recordar siempre.');
  }
  if(/(que recuerdas|que memorizaste|que sabes de mi|mi memoria)/.test(q)){
    if(!cfg.memory.length) return addMsg('bot','Todavía no guardé nada. Decime "recordá que..." seguido de lo que quieras que no olvide.');
    return addMsg('bot','Esto es lo que tengo guardado: ' + cfg.memory.join('. ') + '.');
  }
  if(/(olvidate todo|borra tu memoria|olvida todo)/.test(q)){
    cfg.memory = [];
    localStorage.setItem('frida_memory', '[]');
    return addMsg('bot','Memoria borrada. Arrancamos de cero.');
  }

  // Fallback: LLM si hay clave
  if(cfg.llmKey) return askLLM(text);
  addMsg('bot','Todavía no sé sobre ese tema. Configurá una IA gratis en ⚙️ (Groq o Gemini) para que responda cualquier cosa. También puedo decirte el clima, el tránsito, resolver cuentas, dibujar imágenes, y analizar fotos o PDF que me mandes con el botón de adjuntar.');
}

// ============ CLIMA (Open-Meteo, gratis) ============
function getPos(){ return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000})); }
async function weather(){
  status('Buscando tu ubicación...');
  try{
    const p = await getPos();
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude.toFixed(4)}&longitude=${p.coords.longitude.toFixed(4)}&current_weather=true&timezone=auto`;
    const r = await fetch(url); const d = await r.json();
    const w = d.current_weather;
    const codes = {0:'despejado',1:'mayormente despejado',2:'parcialmente nublado',3:'nublado',45:'con niebla',48:'con niebla',51:'con llovizna',53:'con llovizna',55:'con llovizna',61:'con lluvia leve',63:'con lluvia',65:'con lluvia fuerte',71:'con nieve leve',73:'con nieve',75:'con nieve fuerte',80:'con chaparrones',81:'con chaparrones',82:'con chaparrones fuertes',95:'con tormenta'};
    const desc = codes[w.weathercode] || 'variable';
    addMsg('bot', `Ahora hay ${Math.round(w.temperature)} grados, ${desc}, y el viento va a ${Math.round(w.windspeed)} kilómetros por hora.`);
  }catch(e){
    addMsg('bot','No pude obtener tu ubicación. Activá el GPS y el permiso de ubicación para decirte el clima.');
  }
}
 // ============ TRÁNSITO (TomTom, requiere clave gratis) ============
async function traffic(){
  if(!cfg.tomtom) return addMsg('bot','Para el tránsito necesito una clave de TomTom, es gratis: entra a developer.tomtom.com, crea una cuenta y pegala en Configuración.');
  status('Consultando tránsito...');
  try{
    const p = await getPos();
    const lat=p.coords.latitude, lon=p.coords.longitude, d=0.05;
    const bbox = `${lon-d}%2C${lat-d}%2C${lon+d}%2C${lat+d}`;
    const url = `https://api.tomtom.com/traffic/services/5/incidentDetails?key=${cfg.tomtom}&bbox=${bbox}&fields={incidents{type,geometry{type,coordinates},properties{iconCategory,events{description,length,delay}}}}&language=es-419`;
    const r = await fetch(url); const dta = await r.json();
    const inc = (dta.incidents||[]).filter(i=>i.properties && i.properties.events && i.properties.events.length);
    if(!inc.length) return addMsg('bot','No hay incidentes de tránsito reportados cerca de tu ubicación. El camino está despejado.');
    let totalDelay = 0, ejemplos = [];
    inc.forEach(i=> i.properties.events.forEach(ev=>{ totalDelay += ev.delay||0; if(ev.description && ejemplos.length<2) ejemplos.push(ev.description); }));
    addMsg('bot', `Hay ${inc.length} incidente${inc.length>1?'s':''} cerca. Demora total estimada: ${Math.round(totalDelay/60)} minutos. ${ejemplos[0]?'Por ejemplo: '+ejemplos[0]:''}`);
  }catch(e){ addMsg('bot','No pude consultar el tránsito. Verificá tu clave de TomTom y el GPS.'); }
}

// ============ IMÁGENES (Pollinations, gratis, sin clave) ============
function drawImage(prompt){
  status('Dibujando...');
  const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent('imagen de ' + prompt) + '?width=768&height=768&nologo=true&seed=' + Math.floor(Math.random()*99999);
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.style.padding = '8px';
  const img = document.createElement('img');
  img.src = url; img.alt = prompt; img.style.cssText = 'max-width:100%; border-radius:12px; display:block;';
  const caption = document.createElement('div');
  caption.textContent = '🎨 ' + prompt;
  caption.style.cssText = 'font-size:.8rem; color:#9fb8d8; margin-top:6px;';
  img.onerror = () => { div.textContent = 'No pude generar la imagen. Probá con otra descripción.'; };
  img.onload = () => { status('Tocá el micrófono y hablame'); };
  div.appendChild(img); div.appendChild(caption);
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  speak('Acá tenés tu imagen de ' + prompt + '.');
}

// ============ EDITAR IMÁGENES ============
async function editImage(instruction){
  status('Editando imagen...');
  if(cfg.provider === 'gemini' && cfg.llmKey){
    try{
      const base64 = lastImage.dataUrl.split(',')[1];
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-preview-image-generation:generateContent?key=${cfg.llmKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          contents:[{parts:[
            {text:'Editá esta imagen: ' + instruction},
            {inline_data:{mime_type:lastImage.type, data:base64}}
          ]}],
          generationConfig:{responseModalities:['IMAGE']}
        })
      });
      const d = await r.json();
      if(d.error) throw new Error(d.error.message);
      const part = d.candidates[0].content.parts.find(p=>p.inlineData || p.inline_data);
      if(!part) return addMsg('bot','No pude generar la imagen editada. Probá con otra instrucción.');
      const b64 = (part.inlineData||part.inline_data).data;
      const editedUrl = 'data:image/png;base64,' + b64;
      lastImage = {dataUrl: editedUrl, type:'image/png'};
      return showEditedImage(editedUrl, instruction);
    }catch(err){
      return addMsg('bot','Gemini no pudo editar: ' + err.message);
    }
  }
  try{
    const r = await fetch('https://image.pollinations.ai/prompt/' + encodeURIComponent(instruction), {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: instruction, image: lastImage.dataUrl})
    });
    if(!r.ok) throw new Error('sin respuesta');
    const blob = await r.blob();
    const editedUrl = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(blob); });
    lastImage = {dataUrl: editedUrl, type: blob.type || 'image/png'};
    showEditedImage(editedUrl, instruction);
  }catch(e){
    addMsg('bot','No pude editar la imagen. Para edición con IA de verdad, configurá tu clave de Gemini gratis en ⚙️ Config.');
  }
}

function showEditedImage(url, instruction){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.style.padding = '8px';
  const img = document.createElement('img');
  img.src = url; img.style.cssText = 'max-width:100%; border-radius:12px; display:block;';
  const cap = document.createElement('div');
  cap.textContent = '✏️ ' + instruction;
  cap.style.cssText = 'font-size:.8rem; color:#9fb8d8; margin-top:6px;';
  div.appendChild(img); div.appendChild(cap);
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  status('Tocá el micrófono y hablame');
  speak('Listo, ahí tenés la imagen editada.');
}

// ============ LLM multi-proveedor ============
const SYSTEM_PROMPT = 'Sos Frida, una asistente de voz en español latinoamericano, amable y clara. Respondé en 2 o 3 oraciones cortas, ideal para ser leída en voz alta.';

async function askLLM(text){
  status('Pensando...');
  const prov = cfg.provider;
  try{
    if(prov === 'gemini'){
      const model = cfg.model || PROVIDERS.gemini.models[0];
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.llmKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{parts:[{text: buildSystemPrompt() + '\n\nPregunta: ' + text}]}] })
      });
      const d = await r.json();
      if(d.error) return addMsg('bot','Error de Gemini: ' + d.error.message);
      return addMsg('bot', d.candidates[0].content.parts[0].text.trim());
    }
    // OpenAI-compatible (Groq, OpenRouter, custom)
    const url = prov === 'custom' ? (cfg.url || '').replace(/\/$/,'') + '/chat/completions' : PROVIDERS[prov].url;
    const r = await fetch(url,{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.llmKey },
      body: JSON.stringify({ model: cfg.model || PROVIDERS[prov].models[0], messages:[
        {role:'system', content: buildSystemPrompt()},
        {role:'user', content:text}
      ], max_tokens:250 })
    });
    const d = await r.json();
    if(d.error) return addMsg('bot','Error: ' + (d.error.message || JSON.stringify(d.error)));
    addMsg('bot', d.choices[0].message.content.trim());
  }catch(e){ addMsg('bot','Error de conexión con la IA. Revisá tu internet o la clave.'); }
}
